name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  NFPM_VERSION: v2.42.0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install tools
        run: make install-deps

      - name: Check and test
        run: make vet lint staticcheck test race-test

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@${NFPM_VERSION}

      - name: Build release artifacts
        run: make dist VERSION="${GITHUB_REF_NAME}"

      - name: Write release notes
        run: |
          tag="${GITHUB_REF_NAME}"
          prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${tag}^" 2>/dev/null || true)
          range="${prev:+${prev}..}${tag}"
          {
            echo "## Changes"
            echo
            git log --no-merges --format='- %s (%h)' "${range}"
          } > notes.md
          cat notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          flags=()
          if [[ "${tag}" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "${tag}" dist/* \
            --verify-tag \
            --title "${tag}" \
            --notes-file notes.md \
            "${flags[@]}"

      - name: Check out Homebrew tap
        if: ${{ !contains(github.ref_name, '-') }}
        uses: actions/checkout@v5
        with:
          repository: borud/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: homebrew-tap

      - name: Update Homebrew formula
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          tag="${GITHUB_REF_NAME}"
          scripts/homebrew-formula.sh "${tag}" dist/SHA256SUMS > homebrew-tap/Formula/amplifi.rb
          cd homebrew-tap
          git add Formula/amplifi.rb
          if git diff --cached --quiet; then
            echo "formula already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "amplifi ${tag}"
          git push
