name: "${COMPONENT}"
arch: "${GOARCH}"
platform: "linux"
section: "utils"
version: "${PACKAGE_VERSION}"
maintainer: "${MAINTAINER}"
description: "Inspect and control Ubiquiti AmpliFi routers over the local control protocol"
vendor: "Bjørn Borud"
homepage: "https://github.com/borud/amplifi"
license: "Apache-2.0"

contents:
  # nfpm does not expand env vars here; "make package" stages each arch.
  - src: bin/deb/amplifi
    dst: /usr/bin/amplifi

  - src: LICENSE
    dst: /usr/share/doc/amplifi/copyright
